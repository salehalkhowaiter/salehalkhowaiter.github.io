<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saleh Alkhowaiter | Data Analytics Portfolio</title>
  <style>
    :root { --bg:#ffffff; --text:#1a1a1a; --muted:#666; --card:#f5f5f7; --accent:#0b5fff; --line:#e3e3e6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111; --text:#f0f0f0; --muted:#aaa; --card:#1c1c1e; --accent:#6ea2ff; --line:#2c2c2e; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
           background:var(--bg); color:var(--text); line-height:1.6; }
    main { max-width:860px; margin:0 auto; padding:48px 20px; }
    h1 { margin:0 0 4px; font-size:2rem; }
    .tagline { color:var(--muted); margin:0 0 32px; }
    h2 { font-size:1.2rem; margin:40px 0 16px; }

    .card { display:block; color:inherit; text-decoration:none;
            background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;
            transition:transform .15s ease, box-shadow .15s ease; }
    .card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.14); }
    .card img { width:100%; display:block; }
    .card .body { padding:16px 20px 20px; }
    .card h3 { margin:0 0 6px; }
    .card p { margin:0; color:var(--muted); }
    .tags { display:flex; flex-wrap:wrap; gap:8px; padding:0; margin:14px 0 0; list-style:none; }
    .tags li { background:var(--bg); border:1px solid var(--line); padding:2px 12px;
               border-radius:999px; font-size:.85rem; color:var(--muted); }
    .more { display:inline-block; margin-top:16px; color:var(--accent); font-weight:600; }

    .langs { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:16px 0 0; color:var(--muted); font-size:.95rem; }
    .langs a { color:var(--accent); text-decoration:none; border:1px solid var(--line);
               padding:4px 16px; border-radius:999px; }
    .langs a:hover { background:var(--card); }
  </style>
</head>
<body>
  <main>
    <h1>Saleh Alkhowaiter</h1>
    <p class="tagline">Data Analytics Portfolio</p>

    <h2>Projects</h2>
    <a class="card" href="projects/data-jobs-dashboard/">
      <img src="projects/data-jobs-dashboard/dashboard.gif" alt="Data Jobs Dashboard preview">
      <div class="body">
        <h3>Data Jobs Dashboard</h3>
        <p>Interactive Power BI dashboard comparing data job postings in Saudi Arabia, the USA, and worldwide.</p>
        <ul class="tags">
          <li>Power BI</li>
          <li>DAX</li>
          <li>Power Query</li>
        </ul>
        <span class="more">View project →</span>
      </div>
    </a>
    <p class="langs">
      <span>Read this project in</span>
      <a href="projects/data-jobs-dashboard/">English</a>
      <a href="projects/data-jobs-dashboard/ar.html" lang="ar">العربية</a>
    </p>
  </main>
</body>
</html>
