<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saleh Alkhowaiter | Portfolio</title>
  <style>
    :root { --bg:#ffffff; --text:#1a1a1a; --muted:#666; --card:#f5f5f7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111; --text:#f0f0f0; --muted:#aaa; --card:#1c1c1e; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
           background:var(--bg); color:var(--text); line-height:1.6; }
    main { max-width:860px; margin:0 auto; padding:48px 20px; }
    h1 { margin:0 0 4px; font-size:2rem; }
    .tagline { color:var(--muted); margin:0 0 32px; }
    h2 { font-size:1.2rem; margin:40px 0 16px; }
    .card { background:var(--card); border-radius:12px; overflow:hidden; }
    .card img { width:100%; display:block; }
    .card .body { padding:16px 20px 20px; }
    .card h3 { margin:0 0 6px; }
    .card p { margin:0; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Saleh Alkhowaiter</h1>
    <p class="tagline">Power BI · SQL · Excel</p>

    <h2>Projects</h2>
    <div class="card">
      <img src="projects/data-jobs-dashboard/dashboard.gif" alt="Data Jobs Dashboard preview">
      <div class="body">
        <h3>Data Jobs Dashboard</h3>
        <p>Interactive Power BI dashboard comparing data job postings in Saudi Arabia, the USA, and worldwide.</p>
      </div>
    </div>
  </main>
</body>
</html>
